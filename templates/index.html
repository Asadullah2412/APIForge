<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApiForge - Developer Tools</title>
    <style>
        /* Base Reset & Dark Colors */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            /* Deep dark slate */
            color: #f8fafc;
            /* Crisp near-white text */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Heading Style */
        h1 {
            font-size: 2.8rem;
            color: #f1f5f9;
            margin-bottom: 40px;
            font-weight: 700;
            letter-spacing: -0.5px;
            position: relative;
        }

        h1::after {
            content: '';
            display: block;
            width: 50px;
            height: 4px;
            background-color: #38bdf8;
            /* Vibrant cyan/blue accent */
            margin: 8px auto 0 auto;
            border-radius: 2px;
            box-shadow: 0 2px 8px rgba(56, 189, 248, 0.5);
        }

        /* Grid Container */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }

        /* Tool Cards */
        .card {
            background: #1e293b;
            /* Dark card background */
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            font-size: 1.15rem;
            font-weight: 600;
            color: #cbd5e1;
            /* Subtle silver/gray for text */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid #334155;
            /* Muted border */
        }

        /* Hover Interactions */
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px -3px rgba(56, 189, 248, 0.15), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
            border-color: #38bdf8;
            /* Cyan accent border */
            color: #38bdf8;
            /* Text changes to accent color */
        }

        /* Decorative icon placeholder color */
        .card-icon {
            font-size: 1.5rem;
            margin-bottom: 12px;
            display: block;
        }
    </style>
</head>

<body>

    <h1>ApiForge</h1>

    <div class="container">
        <div class="card">
            <span class="card-icon">📐</span>
            Calculate Area
        </div>
        <div class="card">
            <span class="card-icon">🌤️</span>
            Weather
        </div>
        <div class="card">
            <span class="card-icon">🔄</span>
            Palindrome
        </div>
        <div class="card">
            <span class="card-icon">💱</span>
            Currency Converter
        </div>
        <div class="card">
            <span class="card-icon">📚</span>
            Wikipedia
        </div>
    </div>

</body>

</html>
